<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" xml:space="preserve" role="img" aria-label="Terminal session for Sanjay">
<style>
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
           font-size: 14px; fill: #c0caf5; white-space: pre; }
    .b { font-weight: 700; }
    .art { font-size: 7.0px; font-weight: 700; }
    .fg { fill: #c0caf5; } .dim { fill: #565f89; } .red { fill: #f7768e; } .orange { fill: #ff9e64; } .yellow { fill: #e0af68; } .green { fill: #9ece6a; } .cyan { fill: #7dcfff; } .blue { fill: #7aa2f7; } .magenta { fill: #bb9af7; } .white { fill: #a9b1d6; }
    .ln { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    .type { animation-name: type; animation-fill-mode: forwards; }
    @keyframes type { to { transform: translateX(var(--w)); width: 0; } }
    .cursor { opacity: 0; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
<rect x="1" y="1" width="898" height="130" rx="10" fill="#1a1b26" stroke="#2f334d"/>
<path d="M1 11a10 10 0 0 1 10-10h878a10 10 0 0 1 10 10v26H1z" fill="#16161e"/>
<line x1="1" y1="37" x2="899" y2="37" stroke="#2f334d"/>
<circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/>
<text x="450.0" y="24" text-anchor="middle" class="dim">sanjay — zsh — 100×4</text>
<g class="ln" style="animation-delay:0.40s"><text x="26" y="64"><tspan class="blue b">~ </tspan><tspan class="magenta b">❯ </tspan><tspan class="fg">exit</tspan></text>
<rect x="59.8" y="49" width="45.8" height="20" fill="#1a1b26" class="type" style="--w:45.8px;animation-duration:0.14s;animation-delay:0.65s;animation-timing-function:steps(4)"/></g>
<text x="26" y="85" class="ln" style="animation-delay:1.24s"><tspan class="fg">logout</tspan></text>
<text x="26" y="106" class="ln" style="animation-delay:1.31s"><tspan class="magenta">thanks for stopping by, see ya</tspan></text>
</svg>
